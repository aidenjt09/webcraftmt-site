  <!-- BROWSER SHELL -->
  <rect x="200" y="24" width="280" height="220" rx="18" fill="#EDE8F8" stroke="#D0C4E8" stroke-width="1" style="fill:rgb(237, 232, 248);stroke:rgb(208, 196, 232);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

